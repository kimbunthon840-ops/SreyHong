<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FCEEF2">
  <title>Document</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💕</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating Background Particles -->
  <div class="bg-particles" id="bg-particles"></div>

  <!-- Top Action Controls (Fullscreen & Sound) -->
  <header class="top-bar">
    <button class="top-control-btn fs-highlight" id="fullscreen-toggle" title="ពេញអេក្រង់ / ចាកចេញ" aria-label="Toggle Fullscreen">
      <span class="fs-icon">⛶</span>
      <span class="btn-text">ពេញអេក្រង់</span>
    </button>
    <button class="top-control-btn icon-only" id="audio-toggle" title="បិទ/បើកសំឡេង" aria-label="Toggle Sound">
      🔊
    </button>
  </header>

  <main class="app-viewport">
    
    <!-- ================================================================
         Screen 1: The Cute Love Card ("សូមចុចមើល 💕")
         ================================================================ -->
    <section class="screen active" id="screen-card">
      <div class="cute-card">
        
        <!-- Corner Sticker: Top-Left (Envelope with Heart) -->
        <div class="sticker sticker-top-left" title="💌 សំបុត្រស្នេហា">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" width="100%" height="100%">
            <defs>
              <linearGradient id="envGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="100%" stop-color="#E8E0F0"/>
              </linearGradient>
              <linearGradient id="envFlap" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ECE5F5"/>
                <stop offset="100%" stop-color="#D7CCE6"/>
              </linearGradient>
              <radialGradient id="envHeart" cx="35%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#FF597B"/>
                <stop offset="60%" stop-color="#FF1352"/>
                <stop offset="100%" stop-color="#C70039"/>
              </radialGradient>
              <filter id="envShadow" x="-15%" y="-15%" width="130%" height="135%">
                <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#553366" flood-opacity="0.18"/>
              </filter>
            </defs>
            <g filter="url(#envShadow)" transform="rotate(-8 50 45)">
              <path d="M 12 30 L 50 15 L 88 30 Z" fill="#D2C5E3"/>
              <path d="M 50 35 C 50 25 35 12 25 24 C 15 35 30 52 50 64 C 70 52 85 35 75 24 C 65 12 50 25 50 35 Z" fill="url(#envHeart)"/>
              <ellipse cx="37" cy="24" rx="4" ry="2.5" fill="#FFA5BA" opacity="0.6" transform="rotate(-30 37 24)"/>
              <rect x="12" y="30" width="76" height="50" rx="4" fill="url(#envGrad)" stroke="#C8B8DC" stroke-width="0.8"/>
              <path d="M 12 80 L 44 48 M 88 80 L 56 48" stroke="#D1C3E2" stroke-width="1.2"/>
              <path d="M 12 30 L 50 56 L 88 30" fill="url(#envFlap)" opacity="0.75" stroke="#C8B8DC" stroke-width="0.8"/>
              <path d="M 12 80 L 50 52 L 88 80 Z" fill="#F4EFF8" stroke="#D7CCE6" stroke-width="0.8"/>
            </g>
          </svg>
        </div>

        <!-- Corner Sticker: Top-Right (Teddy Bear) -->
        <div class="sticker sticker-top-right" title="🧸 កូនខ្លាឃ្មុំ Brown">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
            <defs>
              <radialGradient id="bearGrad" cx="40%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#9C6644"/>
                <stop offset="70%" stop-color="#7F4F24"/>
                <stop offset="100%" stop-color="#582F0E"/>
              </radialGradient>
              <radialGradient id="earInner" cx="40%" cy="35%" r="60%">
                <stop offset="0%" stop-color="#DDBEA9"/>
                <stop offset="100%" stop-color="#B79477"/>
              </radialGradient>
              <filter id="bearShadow" x="-10%" y="-10%" width="125%" height="125%">
                <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
              </filter>
            </defs>
            <g filter="url(#bearShadow)">
              <circle cx="28" cy="28" r="16" fill="url(#bearGrad)"/>
              <circle cx="28" cy="28" r="9" fill="url(#earInner)"/>
              <circle cx="72" cy="28" r="16" fill="url(#bearGrad)"/>
              <circle cx="72" cy="28" r="9" fill="url(#earInner)"/>
              <ellipse cx="50" cy="54" rx="38" ry="34" fill="url(#bearGrad)"/>
              <ellipse cx="50" cy="62" rx="17" ry="13" fill="#F8EDEB"/>
              <ellipse cx="50" cy="56" rx="5" ry="3.5" fill="#2B1E16"/>
              <path d="M 50 59.5 L 50 64 Q 45 69 42 64 M 50 64 Q 55 69 58 64" fill="none" stroke="#2B1E16" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M 46 64.5 Q 50 69.5 54 64.5 Z" fill="#FF758F"/>
              <ellipse cx="36" cy="48" rx="3.5" ry="4.5" fill="#2B1E16"/>
              <ellipse cx="64" cy="48" rx="3.5" ry="4.5" fill="#2B1E16"/>
              <circle cx="37" cy="46.5" r="1.2" fill="#FFFFFF"/>
              <circle cx="65" cy="46.5" r="1.2" fill="#FFFFFF"/>
            </g>
          </svg>
        </div>

        <!-- Corner Sticker: Bottom-Left (Sparkling Heart) -->
        <div class="sticker sticker-bottom-left" title="💖 បេះដូងផ្កាយ">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
            <defs>
              <radialGradient id="sparkleHeart" cx="35%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#FF6B8B"/>
                <stop offset="50%" stop-color="#FF2A6D"/>
                <stop offset="100%" stop-color="#D80032"/>
              </radialGradient>
              <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFF9A6"/>
                <stop offset="50%" stop-color="#FFD700"/>
                <stop offset="100%" stop-color="#FFA000"/>
              </linearGradient>
              <filter id="heartGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#FF2A6D" flood-opacity="0.3"/>
              </filter>
            </defs>
            <g filter="url(#heartGlow)">
              <path d="M 50 32 C 50 18 30 8 18 24 C 6 38 24 62 50 78 C 76 62 94 38 82 24 C 70 8 50 18 50 32 Z" fill="url(#sparkleHeart)"/>
              <ellipse cx="32" cy="24" rx="7" ry="4" fill="#FFFFFF" opacity="0.55" transform="rotate(-35 32 24)"/>
              <ellipse cx="68" cy="24" rx="4" ry="2.5" fill="#FFFFFF" opacity="0.35" transform="rotate(35 68 24)"/>
              <g transform="translate(14, 52)">
                <path d="M 12 0 Q 12 12 24 12 Q 12 12 12 24 Q 12 12 0 12 Q 12 12 12 0 Z" fill="url(#starGrad)"/>
                <circle cx="12" cy="12" r="2.5" fill="#FFFFFF"/>
              </g>
              <g transform="translate(72, 12)">
                <path d="M 7 0 Q 7 7 14 7 Q 7 7 7 14 Q 7 7 0 7 Q 7 7 7 0 Z" fill="url(#starGrad)"/>
                <circle cx="7" cy="7" r="1.5" fill="#FFFFFF"/>
              </g>
            </g>
          </svg>
        </div>

        <!-- Corner Sticker: Bottom-Right (Cherry Blossom) -->
        <div class="sticker sticker-bottom-right" title="🌸 ផ្កាសាគូរ៉ា">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
            <defs>
              <radialGradient id="petalGrad" cx="50%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#FFB3C6"/>
                <stop offset="50%" stop-color="#FF758F"/>
                <stop offset="100%" stop-color="#FA386A"/>
              </radialGradient>
              <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FFF9C4"/>
                <stop offset="60%" stop-color="#FFEE58"/>
                <stop offset="100%" stop-color="#FDD835"/>
              </radialGradient>
              <filter id="flowerShadow" x="-15%" y="-15%" width="130%" height="130%">
                <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#FF3366" flood-opacity="0.25"/>
              </filter>
            </defs>
            <g filter="url(#flowerShadow)">
              <path d="M 50 50 C 40 28 35 10 44 6 C 50 3 50 10 50 10 C 50 10 50 3 56 6 C 65 10 60 28 50 50 Z" fill="url(#petalGrad)"/>
              <path d="M 50 50 C 68 36 86 30 90 40 C 93 45 87 47 87 47 C 87 47 93 49 91 55 C 87 63 68 58 50 50 Z" fill="url(#petalGrad)"/>
              <path d="M 50 50 C 66 65 78 82 69 88 C 64 92 61 86 61 86 C 61 86 59 92 53 91 C 44 89 44 68 50 50 Z" fill="url(#petalGrad)"/>
              <path d="M 50 50 C 34 65 22 82 31 88 C 36 92 39 86 39 86 C 39 86 41 92 47 91 C 56 89 56 68 50 50 Z" fill="url(#petalGrad)"/>
              <path d="M 50 50 C 32 36 14 30 10 40 C 7 45 13 47 13 47 C 13 47 7 49 9 55 C 13 63 32 58 50 50 Z" fill="url(#petalGrad)"/>
              <circle cx="50" cy="50" r="11" fill="url(#centerGrad)"/>
              <circle cx="50" cy="43" r="1.5" fill="#E65100"/>
              <circle cx="56" cy="46" r="1.5" fill="#E65100"/>
              <circle cx="55" cy="54" r="1.5" fill="#E65100"/>
              <circle cx="45" cy="54" r="1.5" fill="#E65100"/>
              <circle cx="44" cy="46" r="1.5" fill="#E65100"/>
              <circle cx="50" cy="50" r="1.8" fill="#F57C00"/>
            </g>
          </svg>
        </div>

        <!-- Card Title -->
        <h1 class="card-title">
          សូមចុចមើល <span class="heart-icon">💕</span>
        </h1>

        <!-- Action Button -->
        <button class="cute-btn" id="click-me-btn">
          ចុចខ្ញុំ <span>🤩</span>
        </button>

      </div>
    </section>

    <!-- ================================================================
         Screen 2: The Comic Surprise / Prank Screen
         ================================================================ -->
    <section class="screen hidden" id="screen-prank">
      <div class="prank-container">
        
        <!-- Comic Book Graphic ("FUCK YOU!") - Bulletproof with Base64 Fallback -->
        <div class="comic-box">
          <img src="assets/comic.png" alt="Comic Prank" id="comic-img" onerror="this.onerror=null; this.src=window.COMIC_DATA_URI || 'comic.png';">
        </div>

        <!-- Prank Khmer Text -->
        <div class="comic-text-area">
          <h2 class="prank-question">ចុចមើលធ្វើអ្វី?</h2>
          <p class="prank-love-text">💕 💕 ស្រឡាញ់ញុមមែន 🥰 🥰</p>
        </div>

        <!-- Interactive Action Buttons -->
        <div class="prank-actions">
          <button class="action-btn replay" id="replay-btn">
            <span>🔄</span> ម្តងទៀត
          </button>
          <button class="action-btn secondary" id="share-btn">
            <span>🔗</span> ចែករំលែក
          </button>
          <a href="Hlong_love.html" class="action-btn secondary" title="បើកទំព័រដាច់ដោយឡែក">
            <span>📄</span> ទំព័រដាច់ដោយឡែក
          </a>
        </div>

      </div>
    </section>

  </main>

  <!-- Application Logic (contains embedded Base64 image fallback) -->
  <script src="script.js"></script>
</body>
</html>
